name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run setup (FFmpeg)
        shell: cmd
        run: SETUP.bat --no-pause

      - name: Build EXE
        shell: cmd
        run: build.bat --no-pause

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vid2Script-windows-exe
          path: dist/Vid2Script.exe
          if-no-files-found: error

      - name: Compute SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\Vid2Script.exe -Algorithm SHA256).Hash.ToLower()
          echo "SHA256=$hash" >> $env:GITHUB_ENV
          echo "HASH=$hash" >> $env:GITHUB_ENV

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vid2Script ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Vid2Script ${{ github.ref_name }}

            ## SHA256
            ```
            ${{ env.HASH }}
            ```
          files: dist/Vid2Script.exe
          generate_release_notes: true
